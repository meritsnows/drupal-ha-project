name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform format check
        working-directory: terraform
        run: terraform fmt -check -recursive

      - name: Create a throwaway SSH key for validation
        run: |
          mkdir -p ~/.ssh
          ssh-keygen -t ed25519 -f ~/.ssh/drupal-ha-key -N "" -q

      - name: Terraform validate
        working-directory: terraform
        run: |
          terraform init -backend=false
          terraform validate

      - name: Install Ansible
        run: pip install ansible

      - name: Ansible syntax check
        working-directory: ansible
        run: |
          for f in $(ls *.yml | grep -v aws_ec2); do
            echo "Checking $f"
            ansible-playbook -i localhost, --syntax-check "$f"
          done

  test:
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Test that high availability settings are present
        run: |
          grep -q 'min_size *= *2' terraform/compute.tf && echo "PASS: at least 2 servers"
          grep -q 'resource "aws_autoscaling_policy" "cpu_target"' terraform/compute.tf && echo "PASS: auto scaling policy"
          grep -q 'aws_availability_zones' terraform/network.tf && echo "PASS: subnets across availability zones"
          grep -q 'resource "aws_db_instance"' terraform/network.tf && echo "PASS: managed database"
          grep -q 'resource "aws_lb"' terraform/loadbalancer.tf && echo "PASS: load balancer"

      - name: Test that no AWS keys are in the code
        run: |
          if grep -rEq 'AKIA[0-9A-Z]{16}' terraform ansible; then
            echo "FAIL: a possible AWS access key was found"
            exit 1
          fi
          echo "PASS: no AWS access keys found"
