---
- name: Mount the shared EFS drive for Drupal uploads
  hosts: aws_ec2
  become: true
  vars:
    efs_target: "{{ efs_id }}.efs.eu-north-1.amazonaws.com:/"
    files_path: /var/www/drupal/web/sites/default/files

  tasks:
    - name: Install the NFS client
      ansible.builtin.apt:
        name: nfs-common
        state: present

    - name: Make sure the files folder exists
      ansible.builtin.file:
        path: "{{ files_path }}"
        state: directory

    - name: Mount the shared drive
      ansible.posix.mount:
        src: "{{ efs_target }}"
        path: "{{ files_path }}"
        fstype: nfs4
        opts: nfsvers=4.1,rsize=1048576,wsize=1048576,hard,timeo=600,retrans=2,noresvport,_netdev
        state: mounted

    - name: Give Apache ownership of the shared folder
      ansible.builtin.file:
        path: "{{ files_path }}"
        owner: www-data
        group: www-data
        mode: "0775"